<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現股當沖損益計算機</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="當沖計算">
    <link rel="apple-touch-icon" href="icon-180.png">
    
    <link rel="manifest" href="manifest.json">

    <style>
        body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #f4f7f6; 
    
    /* 關鍵：讓內容完全置中 */
    display: flex; 
    justify-content: center; 
    align-items: center; /* 垂直置中 */
    min-height: 100vh;   /* 讓身體高度至少等於螢幕高度 */
    margin: 0;           /* 移除預設邊距 */
    
    padding: 20px; 
    box-sizing: border-box;
}

.card { 
    background: white; 
    padding: 25px; 
    border-radius: 12px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    width: 100%; 
    max-width: 400px; 
    /* 避免在 App 模式下太貼頂部 */
    margin-top: env(safe-area-inset-top); 
}
    </style>
</head>
<body>

<div class="card">
    <h2>現股當沖試算 (2.5折)</h2>
    
    <div class="input-group">
        <label>買入價格</label>
        <input type="number" id="buyPrice" step="0.01" inputmode="decimal" placeholder="例如: 100">
    </div>
    
    <div class="input-group">
        <label>賣出價格</label>
        <input type="number" id="sellPrice" step="0.01" inputmode="decimal" placeholder="例如: 102">
    </div>

    <div class="result" id="summary">
        請輸入價格進行計算...
    </div>

    <div id="tickAnalysis"></div>
</div>

<script>
    const buyInput = document.getElementById('buyPrice');
    const sellInput = document.getElementById('sellPrice');
    const summaryDiv = document.getElementById('summary');
    const tickDiv = document.getElementById('tickAnalysis');

    function getTickSize(price) {
        if (price < 10) return 0.01;
        if (price < 50) return 0.05;
        if (price < 100) return 0.1;
        if (price < 500) return 0.5;
        if (price < 1000) return 1.0;
        return 5.0;
    }

    function calculate(buyP, sellP) {
        const shares = 1000;
        const discount = 0.25;
        const feeRate = 0.001425;
        const taxRate = 0.0015;

        let buyFee = Math.floor(buyP * shares * feeRate * discount);
        if (buyFee < 20) buyFee = 20;
        const totalCost = (buyP * shares) + buyFee;

        let sellFee = Math.floor(sellP * shares * feeRate * discount);
        if (sellFee < 20) sellFee = 20;
        const tax = Math.floor(sellP * shares * taxRate);
        const totalRevenue = (sellP * shares) - sellFee - tax;

        const profit = totalRevenue - totalCost;
        return { profit, totalExpenses: buyFee + sellFee + tax };
    }

    function updateUI() {
        const buyP = parseFloat(buyInput.value);
        const sellP = parseFloat(sellInput.value);
        if (isNaN(buyP) || buyP <= 0) {
            summaryDiv.innerHTML = "請輸入價格進行計算...";
            tickDiv.innerHTML = "";
            return;
        }

        if (!isNaN(sellP)) {
            const res = calculate(buyP, sellP);
            const colorClass = res.profit >= 0 ? 'profit' : 'loss';
            summaryDiv.innerHTML = `
                <div style="font-size: 1.1rem;">預估損益: <span class="${colorClass}">${res.profit.toLocaleString()} 元</span></div>
                <div style="font-size: 12px; color: #888; margin-top:5px;">交易成本: ${res.totalExpenses.toLocaleString()} 元</div>
            `;
        }

        const tick = getTickSize(buyP);
        let tableHTML = `<table><thead><tr><th>跳動</th><th>價格</th><th>損益</th></tr></thead><tbody class="tick-table">`;
        for (let i = 1; i <= 5; i++) {
            const targetP = buyP + (tick * i);
            const res = calculate(buyP, targetP);
            const colorClass = res.profit >= 0 ? 'profit' : 'loss';
            tableHTML += `<tr><td>+${i} Tick</td><td>${targetP.toFixed(2)}</td><td class="${colorClass}">${res.profit.toLocaleString()}</td></tr>`;
        }
        tableHTML += `</tbody></table>`;
        tickDiv.innerHTML = "<h4>距離獲利還有幾檔？</h4>" + tableHTML;
    }

    buyInput.addEventListener('input', updateUI);
    sellInput.addEventListener('input', updateUI);

    // 註冊 Service Worker (PWA 必要)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }
</script>
</body>
</html>
