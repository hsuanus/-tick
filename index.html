<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>當沖 2.5折 獲利試算</title>
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; min-height: 100vh; padding: 20px; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; font-size: 1.5rem; }
        .input-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 14px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 18px; box-sizing: border-box; transition: 0.2s; -webkit-appearance: none; }
        input:focus { border-color: var(--primary); outline: none; background: #f0f7ff; }
        .res-card { background: #f1f5f9; border-radius: 16px; padding: 18px; margin-top: 10px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; align-items: center; }
        .b-text { font-weight: 800; font-size: 1.1rem; }
        .rebate-tag { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .profit { color: var(--success); }
        .loss { color: var(--danger); }
        .divider { border-top: 1px dashed #cbd5e1; margin: 15px 0; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 30px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 當沖獲利試算 (2.5折)</h2>
    
    <div class="input-row">
        <div class="input-group">
            <label>買入價格</label>
            <input type="number" id="buyPrice" placeholder="輸入股價" step="0.01" inputmode="decimal" oninput="run()">
        </div>
        <div class="input-group" style="flex: 0.6;">
            <label>張數</label>
            <input type="number" id="qty" value="1" inputmode="numeric" oninput="run()">
        </div>
    </div>

    <div id="display" style="display:none;">
        <div class="res-card">
            <div class="row">
                <span>需跳動檔數 (回本)</span>
                <span id="resTicks" class="b-text" style="color:var(--primary)">-</span>
            </div>
            <div class="row">
                <span>損益兩平點</span>
                <span id="resBPrice" class="b-text">-</span>
            </div>
            <div class="divider"></div>
            <div class="row">
                <span>預估月退傭 <span class="rebate-tag">2.5折</span></span>
                <span id="resRebate" style="font-weight: bold; color:var(--primary)">-</span>
            </div>
        </div>

        <h3 style="font-size: 16px; margin: 25px 0 15px 0; color: #334155;">即時盈虧預估 (含稅費)：</h3>
        <div class="row"><span>平盤賣出 (0 檔)</span> <span id="p0" class="b-text">-</span></div>
        <div class="row"><span>跳動 1 檔</span> <span id="p1" class="b-text">-</span></div>
        <div class="row"><span>跳動 2 檔</span> <span id="p2" class="b-text">-</span></div>
        <div class="row"><span>跳動 3 檔</span> <span id="p3" class="b-text">-</span></div>
    </div>

    <div class="footer">
        手續費率 0.1425% (2.5折) | 當沖證交稅 0.15%<br>
        本計算結果僅供參考，實際盈虧以券商帳單為準。
    </div>
</div>

<script>
const getTick = (p) => {
    if (p < 10) return 0.01; if (p < 50) return 0.05; if (p < 100) return 0.1;
    if (p < 500) return 0.5; if (p < 1000) return 1; return 5;
};

function run() {
    const p = parseFloat(document.getElementById('buyPrice').value);
    const q = parseInt(document.getElementById('qty').value) || 0;
    if(!p || p <= 0) { document.getElementById('display').style.display='none'; return; }
    
    document.getElementById('display').style.display='block';
    const shares = q * 1000;
    const feeRate = 0.001425;
    const disc = 0.25;
    const taxRate = 0.0015;

    const rawFeeBuy = Math.floor(p * shares * feeRate);
    const netFeeBuy = Math.max(20, Math.floor(rawFeeBuy * disc));
    const totalBuyCost = (p * shares) + netFeeBuy;
    const rebateBuy = rawFeeBuy - netFeeBuy;

    const tSize = getTick(p);
    const breakPrice = p * (1 + (feeRate * disc * 2) + taxRate);
    const neededTicks = Math.ceil((breakPrice - p) / tSize);

    function getProfit(sellP) {
        const rawFeeSell = Math.floor(sellP * shares * feeRate);
        const netFeeSell = Math.max(20, Math.floor(rawFeeSell * disc));
        const tax = Math.floor(sellP * shares * taxRate);
        const net = Math.floor(sellP * shares - netFeeSell - tax - totalBuyCost);
        const rebate = (rawFeeSell - netFeeSell) + rebateBuy;
        return { net, rebate };
    }

    document.getElementById('resTicks').innerText = neededTicks + ' 檔';
    document.getElementById('resBPrice').innerText = breakPrice.toFixed(2);
    
    const d0 = getProfit(p);
    const d1 = getProfit(p + tSize);
    const d2 = getProfit(p + tSize * 2);
    const d3 = getProfit(p + tSize * 3);

    const fmt = (d) => `<span class="${d.net >=0 ? 'profit':'loss'}">${d.net >=0 ? '+':''}${d.net.toLocaleString()}</span>`;
    
    document.getElementById('p0').innerHTML = fmt(d0);
    document.getElementById('p1').innerHTML = fmt(d1);
    document.getElementById('p2').innerHTML = fmt(d2);
    document.getElementById('p3').innerHTML = fmt(d3);
    document.getElementById('resRebate').innerText = '$' + d0.rebate.toLocaleString();
}
</script>
</body>
</html>
